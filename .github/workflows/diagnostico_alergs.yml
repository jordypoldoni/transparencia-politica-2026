name: Diagnostico ALERGS (manual)

# Criado em 15/10/2026 para o T4b. So dispara na mao (botao "Run workflow"): descobre POR QUE o
# GitHub nao alcanca a ALERGS (reset, timeout, 403 ou DNS), ja que o coletor so loga "fetch failed".
# Nao grava nada, nao usa segredo. Pode ser apagado depois de resolvido o T4b.
on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: IP de saida do runner
        continue-on-error: true
        run: curl -sS -m 15 https://api.ipify.org; echo

      - name: curl nos dois hosts
        continue-on-error: true
        run: |
          for u in \
            "https://ww4.al.rs.gov.br:5000/listarDestaqueDeputados" \
            "https://transparencia.al.rs.gov.br/parlamentares/votos-plenario" \
            "https://ww4.al.rs.gov.br/"; do
            echo "=================== $u"
            curl -sS -v -m 20 -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" "$u" 2>&1 | grep -v -E "^\{|^\}" || true
          done

      - name: fetch do Node (como o coletor) mostrando a causa
        continue-on-error: true
        run: |
          node -e '
          const urls = [
            "https://ww4.al.rs.gov.br:5000/listarDestaqueDeputados",
            "https://transparencia.al.rs.gov.br/parlamentares/votos-plenario",
            "https://ww4.al.rs.gov.br/"
          ];
          (async () => {
            for (const u of urls) {
              const t = Date.now();
              try {
                const r = await fetch(u, { signal: AbortSignal.timeout(20000) });
                console.log(u, "->", r.status, (Date.now() - t) + " ms");
              } catch (e) {
                console.log(u, "-> ERRO:", e.message, "| causa:", e.cause && (e.cause.code || e.cause.message), (Date.now() - t) + " ms");
              }
            }
          })();
          '
