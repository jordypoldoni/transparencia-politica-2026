# coletar_fiscal.yml — o segundo agendamento do projeto. (19/09/2026)
#
# Dois coletores que ficaram de fora do coletar.yml, por motivos opostos:
#
#  - coletor_siconfi.js: pendência aberta em 22/08/2026. O painel fiscal só atualizava
#    quando alguém lembrava de rodar à mão. O dado do Tesouro é BIMESTRAL, então rodar
#    todo dia seria bater na API do Tesouro por nada. ESTE É AGENDADO.
#  - coletor_ficha_tse.js: criado em 18/09/2026, quando as seções ao vivo do presidenciável
#    saíram do ar. Precisaria do oposto, diário até a eleição, e NÃO É AGENDADO. Por quê,
#    está escrito no job dele abaixo. Fica aqui como botão, para rodar quando fizer sentido.
#
# LEMBRETE DO QUE O HORÁRIO SIGNIFICA (mesma nota do coletar.yml): o cron do GitHub é um
# PEDIDO, não uma promessa. O atraso típico neste repo foi de 3 a 6 horas, com um caso de 10h.
# Não dependa da hora exata. O minuto quebrado é de propósito, porque minuto 0 é o mais
# disputado da fila.

name: Coletar dados (fiscal e TSE)

on:
  schedule:
    # 08:23 de Brasília, dia 5 de fev/abr/jun/ago/out/dez. Alinhado ao calendário de
    # publicação do Tesouro, que é bimestral.
    - cron: '23 11 5 2,4,6,8,10,12 *'
  workflow_dispatch:
    inputs:
      alvo:
        description: 'O que rodar agora'
        type: choice
        required: true
        default: ficha-tse
        options:
          - ficha-tse
          - siconfi
          - ambos

jobs:
  # ---------------------------------------------------------------------------
  # Ficha do TSE (DivulgaCandContas) — SÓ NA MÃO
  # ---------------------------------------------------------------------------
  #
  # POR QUE ESTE JOB NÃO TEM CRON, e a história inteira, porque ela custou uma sessão.
  #
  # O Akamai do TSE bloqueia por ORIGEM, faixa de datacenter. Medido em 19/09/2026:
  #   Vercel .................. 403 (era o motivo de as seções do presidenciável sumirem)
  #   sandbox de nuvem ........ 403
  #   runner do GitHub Actions  403  (as 28 fichas e as 2 listagens, na 1ª execução daqui)
  #   Edge Function Supabase .. 200  (33.707 bytes, 1,7s, região sa-east-1)
  #   máquina do Jordy ........ 200  (28 de 28)
  #
  # A ponte no Supabase (função `tse-ponte`) foi construída para contornar isso, e o coletor
  # sabe usá-la pela variável TSE_PONTE_URL. Mas a execução seguinte ainda falhou, com motivo
  # não diagnosticado (só `exit code 1`; o anexo saida-ficha-tse da execução tem o log, e se
  # lá estiver `ponte: credencial invalida` o conserto é a chave de serviço do GitHub não ser
  # a mesma que o Supabase injeta na função).
  #
  # Parou aqui por decisão de escopo, não por falta de caminho: o Jordy roda o coletor na
  # máquina dele, que funciona, e a necessidade diária acaba com a eleição de 04/10.
  #
  # O CRON DIÁRIO FOI REMOVIDO DE PROPÓSITO. Agendamento que se sabe que vai falhar manda
  # e-mail vermelho todo dia e ensina a ignorar falha de verdade, que é o oposto do que este
  # arquivo existe para fazer.
  #
  # SE UM DIA O CRON VOLTAR: voltar junto a trava de data que estava aqui. Ela impedia o
  # agendamento de bater no TSE para sempre depois que a ficha congela (o limite era
  # 2026-11-01, com aviso na página da execução em vez de parada silenciosa).
  ficha-tse:
    name: Ficha do TSE (situação, patrimônio, documentos)
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && (inputs.alvo == 'ficha-tse' || inputs.alvo == 'ambos') }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        # --ignore-scripts evita compilação nativa do sharp (não usado nos coletores)
        run: npm install --ignore-scripts

      # SEM continue-on-error, de propósito, e é a diferença de desenho em relação ao
      # coletar.yml. Lá os passos toleram falha porque um coletor fora do ar não invalida os
      # outros. Aqui o job inteiro É a coleta: se ela não traz nada, a tela continua mostrando
      # a situação de ontem sem dizer que é de ontem. O coletor sai com código 1 quando lê
      # zero fichas, então o passo fica vermelho em vez de verde mentiroso.
      #
      # TSE_PONTE_URL manda o coletor falar com o TSE através da função `tse-ponte` do
      # Supabase, em vez de direto. Sem a variável ele vai direto e leva 403 daqui. A segunda
      # linha da saída diz qual dos dois caminhos ele tomou. A URL não é segredo: a função
      # exige a chave de serviço no Authorization, e a referência do projeto já é pública no
      # próprio site.
      - name: Coletar as fichas do DivulgaCandContas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TSE_PONTE_URL: https://fedxytdorrecllugnicu.supabase.co/functions/v1/tse-ponte
        run: node coletores/coletor_ficha_tse.js

      # O coletor grava tudo que imprime em coletores/_saida_ficha_tse.txt (hábito que nasceu
      # porque o terminal da máquina do Jordy quebrou em 08/09). Aqui esse arquivo vira anexo
      # da execução, então dá para ler o diagnóstico sem abrir o log linha a linha.
      # if: always() — o caso em que o arquivo mais interessa é justamente o da falha.
      - name: Guardar a saída do coletor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida-ficha-tse
          path: coletores/_saida_ficha_tse.txt
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Panorama fiscal (SICONFI / Tesouro Nacional) — bimestral
  # ---------------------------------------------------------------------------
  siconfi:
    name: Panorama fiscal (SICONFI)
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.schedule == '23 11 5 2,4,6,8,10,12 *'
          || (github.event_name == 'workflow_dispatch'
              && (inputs.alvo == 'siconfi' || inputs.alvo == 'ambos')) }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --ignore-scripts

      # 29 entes (União, 26 estados e o DF) com pausa de 200ms entre eles, mais o download da
      # lista completa de entes. Leva alguns minutos; o teto de 30 é rede travada, não trabalho.
      - name: Coletar entes e execução orçamentária
        timeout-minutes: 30
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node coletores/coletor_siconfi.js
