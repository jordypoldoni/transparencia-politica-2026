# coletar_fiscal.yml — o segundo agendamento do projeto. (19/09/2026)
#
# Dois coletores que ficaram de fora do coletar.yml, por motivos opostos:
#
#  - coletor_siconfi.js: pendência aberta em 22/08/2026. O painel fiscal só atualizava
#    quando alguém lembrava de rodar à mão. O dado do Tesouro é BIMESTRAL, então rodar
#    todo dia seria bater na API do Tesouro por nada. ESTE É AGENDADO.
#  - a ficha do TSE (presidenciáveis e deputados federais): diária até a eleição. Ficou só como
#    botão entre 19/09 e 21/09 porque a ponte ainda não funcionava; a história está no job.
#
# LEMBRETE DO QUE O HORÁRIO SIGNIFICA (mesma nota do coletar.yml): o cron do GitHub é um
# PEDIDO, não uma promessa. O atraso típico neste repo foi de 3 a 6 horas, com um caso de 10h.
# Não dependa da hora exata. O minuto quebrado é de propósito, porque minuto 0 é o mais
# disputado da fila.

name: Coletar dados (fiscal e TSE)

on:
  schedule:
    # 08:23 de Brasília, dia 5 de fev/abr/jun/ago/out/dez. Alinhado ao calendário de
    # publicação do Tesouro, que é bimestral.
    - cron: '23 11 5 2,4,6,8,10,12 *'
    # Ficha do TSE, DIÁRIA: só quem ainda pode mudar de situação. 07:41 de Brasília.
    - cron: '41 10 * * *'
    # Ficha do TSE, SEMANAL (domingo): todos os 7.703. 03:53 de Brasília, fila vazia.
    - cron: '53 6 * * 0'
  workflow_dispatch:
    inputs:
      alvo:
        description: 'O que rodar agora'
        type: choice
        required: true
        default: ficha-tse
        options:
          - ficha-tse
          - ficha-tse-completa
          - siconfi
          - ambos

jobs:
  # ---------------------------------------------------------------------------
  # Ficha do TSE (DivulgaCandContas) — diária até a eleição, completa aos domingos
  # ---------------------------------------------------------------------------
  #
  # A HISTÓRIA, porque ela custou três sessões.
  #
  # O Akamai do TSE bloqueia por ORIGEM, faixa de datacenter. Medido em 19/09/2026:
  #   Vercel .................. 403
  #   sandbox de nuvem ........ 403
  #   runner do GitHub Actions  403  (por isso este job NÃO fala direto com o TSE)
  #   Edge Function Supabase .. 200  (região sa-east-1)
  #   máquina do Jordy ........ 200
  #
  # Então o caminho é GitHub -> função `tse-ponte` do Supabase -> TSE. A ponte existia desde
  # 19/09 e dava 401 em TODA chamada: comparava a senha com a chave de serviço que o Supabase
  # injeta, e o projeto tinha passado às chaves novas. Consertado em 20/09 com senha própria,
  # PONTE_TOKEN, que também tirou a chave do banco de dentro de um endpoint público. Em 21/09 a
  # ponte rodou em produção pela primeira vez, servindo o site. Por isso o cron voltou.
  #
  # POR QUE DUAS CADÊNCIAS, medido em 21/09: das 7.703 fichas de federal, só 390 estavam numa
  # situação que ainda muda (indeferido com recurso, deferido com recurso, pendente). Recoletar
  # todas todo dia seriam 100 mil requisições até 04/10 pela mesma ponte, convidando o Akamai a
  # desconfiar dela também. Diário: os 390 e os 28 presidenciáveis, uns 5 minutos. Domingo: tudo,
  # uns 80, para pegar quem era definitivo e mudou. Os 318 senadores (desde 22/09) vão inteiros
  # nos dois, porque cabem em 3 minutos.
  ficha-tse:
    name: Ficha do TSE (situação, patrimônio, trajetória)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    if: >-
      ${{ github.event.schedule == '41 10 * * *'
          || github.event.schedule == '53 6 * * 0'
          || (github.event_name == 'workflow_dispatch'
              && (inputs.alvo == 'ficha-tse' || inputs.alvo == 'ficha-tse-completa' || inputs.alvo == 'ambos')) }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # A URL não é segredo (a referência do projeto é pública no site). A SENHA é.
      TSE_PONTE_URL: https://fedxytdorrecllugnicu.supabase.co/functions/v1/tse-ponte
      PONTE_TOKEN: ${{ secrets.PONTE_TOKEN }}
    steps:
      # TRAVA DE DATA, que o comentário de 19/09 pedia para voltar junto com o cron. Sem ela, o
      # agendamento continuaria batendo no TSE para sempre depois que a ficha congela. O limite é
      # 01/11 e não 04/10 de propósito: logo depois da eleição a ficha passa a dizer quem foi
      # eleito, e isso vale pegar. Passada a data, avisa na página da execução em vez de parar
      # calado, e o botão manual continua funcionando.
      - name: Trava de data (agendamento termina em 01/11/2026)
        id: trava
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y%m%d)" -gt 20261101 ]; then
            echo "::warning title=Ficha do TSE::Agendamento encerrado em 01/11/2026. Remover os dois crons da ficha deste arquivo. O botão manual continua funcionando."
            echo "parar=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout do código
        if: steps.trava.outputs.parar != '1'
        uses: actions/checkout@v4

      - name: Configurar Node
        if: steps.trava.outputs.parar != '1'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        if: steps.trava.outputs.parar != '1'
        # --ignore-scripts evita compilação nativa do sharp (não usado nos coletores)
        run: npm install --ignore-scripts

      # SEM continue-on-error, de propósito. Aqui o job inteiro É a coleta: se ela não traz nada,
      # a tela continua mostrando a situação de ontem sem dizer que é de ontem. Os coletores saem
      # com código 1 quando leem zero fichas, então o passo fica vermelho em vez de verde mentiroso.
      - name: Presidenciáveis (28 fichas)
        if: steps.trava.outputs.parar != '1'
        run: node coletores/coletor_ficha_tse.js

      # Senadores entraram em 22/09/2026. São 318, então vão INTEIROS todo dia (uns 3 minutos),
      # sem o filtro de situação aberta que os 7.703 deputados precisam. Pela ponte a foto é
      # pulada (imagem não atravessa a ponte como texto) e quem já tem foto não perde; a ligação
      # com quem tem mandato (agente_id, reeleicao) também não é tocada, porque o upsert só
      # grava as colunas que manda.
      - name: Candidatos a Senador (318 fichas)
        if: steps.trava.outputs.parar != '1'
        run: node coletores/coletor_candidatos_senador_2026.js

      # Diário e botão comum: só quem ainda pode mudar. Domingo e botão "completa": todos.
      - name: Deputados federais
        if: steps.trava.outputs.parar != '1'
        run: |
          if [ "${{ github.event.schedule }}" = "53 6 * * 0" ] || [ "${{ inputs.alvo }}" = "ficha-tse-completa" ]; then
            node coletores/coletor_ficha_tse_federal.js --refazer
          else
            node coletores/coletor_ficha_tse_federal.js --abertos
          fi

      # O coletor dos presidenciáveis grava o que imprime em coletores/_saida_ficha_tse.txt.
      # Aqui vira anexo, para ler o diagnóstico sem abrir o log linha a linha.
      #
      # continue-on-error DESDE 22/09/2026. Na primeira execução agendada a coleta gravou tudo
      # (28 presidenciáveis e 383 federais) e este passo falhou com 403 no serviço de anexos do
      # GitHub, pintando de vermelho uma coleta bem-sucedida. Vermelho aqui precisa significar
      # "a coleta falhou"; se um anexo de conveniência também pinta, a pessoa aprende a ignorar
      # o vermelho, e a falha de verdade passa. O anexo é diagnóstico, não é a coleta.
      - name: Guardar a saída do coletor
        if: always() && steps.trava.outputs.parar != '1'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: saida-ficha-tse
          path: coletores/_saida_ficha_tse.txt
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Panorama fiscal (SICONFI / Tesouro Nacional) — bimestral
  # ---------------------------------------------------------------------------
  siconfi:
    name: Panorama fiscal (SICONFI)
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.schedule == '23 11 5 2,4,6,8,10,12 *'
          || (github.event_name == 'workflow_dispatch'
              && (inputs.alvo == 'siconfi' || inputs.alvo == 'ambos')) }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --ignore-scripts

      # 29 entes (União, 26 estados e o DF) com pausa de 200ms entre eles, mais o download da
      # lista completa de entes. Leva alguns minutos; o teto de 30 é rede travada, não trabalho.
      - name: Coletar entes e execução orçamentária
        timeout-minutes: 30
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node coletores/coletor_siconfi.js
