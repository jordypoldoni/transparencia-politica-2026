# coletar_fiscal.yml — o segundo agendamento do projeto. (19/09/2026)
#
# Por que existe, e por que os dois coletores moram no mesmo arquivo com cadências
# diferentes: os dois ficaram de fora do coletar.yml por motivos opostos.
#
#  - coletor_siconfi.js: pendência aberta em 22/08/2026. O painel fiscal só atualizava
#    quando alguém lembrava de rodar à mão. O dado do Tesouro é BIMESTRAL, então rodar
#    todo dia seria bater na API do Tesouro por nada.
#  - coletor_ficha_tse.js: criado em 18/09/2026, quando as seções ao vivo do presidenciável
#    saíram do ar (o Akamai do TSE recusa a Vercel com 403) e o dado passou a vir do banco.
#    Este precisa do oposto: situação de candidatura, substituição e indeferimento mudam
#    TODO DIA até a eleição de 04/10, e dado guardado envelhece em silêncio.
#
# Juntar os dois num arquivo só e separar por `if` custa duas linhas de condição e evita
# um terceiro arquivo de workflow. Cada cron dispara um job só; o outro nem inicia.
#
# LEMBRETE DO QUE O HORÁRIO SIGNIFICA (mesma nota do coletar.yml): o cron do GitHub é um
# PEDIDO, não uma promessa. O atraso típico neste repo foi de 3 a 6 horas, com um caso de 10h.
# Não dependa da hora exata. O minuto quebrado é de propósito, porque minuto 0 é o mais
# disputado da fila.

name: Coletar dados (fiscal e TSE)

on:
  schedule:
    # 07:41 de Brasília, todo dia. Fora do horário do coletar.yml (06:17) de propósito:
    # dois workflows do mesmo repo na mesma fila competem entre si.
    - cron: '41 10 * * *'
    # 08:23 de Brasília, dia 5 de fev/abr/jun/ago/out/dez. Alinhado ao calendário de
    # publicação do Tesouro, que é bimestral.
    - cron: '23 11 5 2,4,6,8,10,12 *'
  workflow_dispatch:
    inputs:
      alvo:
        description: 'O que rodar agora'
        type: choice
        required: true
        default: ficha-tse
        options:
          - ficha-tse
          - siconfi
          - ambos

jobs:
  # ---------------------------------------------------------------------------
  # Ficha do TSE (DivulgaCandContas) — diário até a eleição
  # ---------------------------------------------------------------------------
  ficha-tse:
    name: Ficha do TSE (situação, patrimônio, documentos)
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.schedule == '41 10 * * *'
          || (github.event_name == 'workflow_dispatch'
              && (inputs.alvo == 'ficha-tse' || inputs.alvo == 'ambos')) }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        # --ignore-scripts evita compilação nativa do sharp (não usado nos coletores)
        run: npm install --ignore-scripts

      # A cadência diária tem prazo de validade. Depois da eleição a ficha congela, e um
      # agendamento que ninguém desliga vira batida diária na fonte para sempre. Em vez de
      # parar em silêncio, o passo avisa na página da execução que é hora de baixar a
      # frequência. Rodada manual ignora a janela.
      - name: Conferir se ainda estamos na janela da eleição
        id: janela
        run: |
          HOJE=$(date -u +%Y-%m-%d)
          LIMITE=2026-11-01
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            echo "Rodada manual: janela ignorada."
          elif [[ "$HOJE" < "$LIMITE" ]]; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            echo "Dentro da janela ($HOJE < $LIMITE)."
          else
            echo "rodar=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Coleta diária do TSE vencida::Passou de $LIMITE. A eleição acabou e a ficha não muda mais todo dia. Tire o cron diário deste workflow ou baixe a frequência."
          fi

      # SEM continue-on-error, de propósito, e é a diferença de desenho em relação ao
      # coletar.yml. Lá os passos toleram falha porque um coletor fora do ar não invalida os
      # outros. Aqui o job inteiro É a coleta: se ela não traz nada, a tela continua mostrando
      # a situação de ontem sem dizer que é de ontem. O coletor sai com código 1 quando lê
      # zero fichas, então o passo fica vermelho e aparece na caixa de entrada.
      #
      # RISCO CONHECIDO E NÃO TESTADO: o Akamai do TSE bloqueia por ORIGEM. Derrubou a Vercel
      # (403 de iad1) e derruba o sandbox de nuvem. Ninguém testou ainda o IP do runner do
      # GitHub. Se a primeira execução vier vermelha com 403 em todas as 28 fichas, não é
      # regressão do código: é a mesma parede, e aí a coleta volta a ser manual ou vai para
      # uma máquina com IP residencial.
      - name: Coletar as fichas do DivulgaCandContas
        if: steps.janela.outputs.rodar == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node coletores/coletor_ficha_tse.js

      # O coletor grava tudo que imprime em coletores/_saida_ficha_tse.txt (hábito que nasceu
      # porque o terminal da máquina do Jordy quebrou em 08/09). Aqui esse arquivo vira anexo
      # da execução, então dá para ler o diagnóstico sem abrir o log linha a linha.
      # if: always() — o caso em que o arquivo mais interessa é justamente o da falha.
      - name: Guardar a saída do coletor
        if: always() && steps.janela.outputs.rodar == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: saida-ficha-tse
          path: coletores/_saida_ficha_tse.txt
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Panorama fiscal (SICONFI / Tesouro Nacional) — bimestral
  # ---------------------------------------------------------------------------
  siconfi:
    name: Panorama fiscal (SICONFI)
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.schedule == '23 11 5 2,4,6,8,10,12 *'
          || (github.event_name == 'workflow_dispatch'
              && (inputs.alvo == 'siconfi' || inputs.alvo == 'ambos')) }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --ignore-scripts

      # 29 entes (União, 26 estados e o DF) com pausa de 200ms entre eles, mais o download da
      # lista completa de entes. Leva alguns minutos; o teto de 30 é rede travada, não trabalho.
      - name: Coletar entes e execução orçamentária
        timeout-minutes: 30
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node coletores/coletor_siconfi.js
