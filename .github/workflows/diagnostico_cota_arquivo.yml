# diagnostico_cota_arquivo.yml: lê o arquivo anual da cota da Câmara e conta por tipo de despesa. (21/10/2026)
# SÓ LEITURA, não usa banco. O resultado sai como anotações da execução. Manual.
name: Diagnóstico do arquivo da cota (Câmara)

on:
  workflow_dispatch:
    inputs:
      ano:
        description: 'Ano (ex.: 2026)'
        required: true
        default: '2026'
      cadastro:
        description: 'ideCadastro do deputado a detalhar'
        required: true
        default: '178983'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Ler o arquivo anual
        env:
          ANO: ${{ github.event.inputs.ano }}
          CAD: ${{ github.event.inputs.cadastro }}
        run: node coletores/diagnostico_cota_arquivo.js "$ANO" "$CAD"
