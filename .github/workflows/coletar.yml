name: Coletar dados (votos)

on:
  schedule:
    # 06:17 Brasília. O minuto quebrado é de proposito: o GitHub enfileira os agendamentos e
    # os horarios "redondos" (minuto 0) sao os mais disputados. Ainda assim o horario e um
    # PEDIDO, nao uma promessa — no historico deste repo o atraso tipico foi de 3 a 6 horas,
    # com um caso de 10h. Nao dependa da hora exata para nada.
    - cron: '17 9 * * *'
  workflow_dispatch:        # permite rodar manualmente pelo botão "Run workflow"

jobs:
  coletar-votos:
    runs-on: ubuntu-latest
    # Teto de 150 min (T14, 17/10/2026): as durações medidas vão de 8 min a 1h32; só corta travamento de rede.
    timeout-minutes: 150
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        # --ignore-scripts evita compilação nativa do sharp (não usado nos coletores)
        run: npm install --ignore-scripts

      - name: Rodar coletor de votos (Câmara)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VOTACOES_LIMIT: '60'
        run: node coletores/coletor_votos.js

      - name: Rodar coletor de votos do Senado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANO: '2026'
        continue-on-error: true
        run: node coletores/coletor_votos_senado.js

      # 20/09/2026: trocado de coletor_gastos.js para coletor_gastos_arquivo.js.
      # O endpoint /deputados/{id}/despesas da Camara devolve 200 com lista VAZIA para
      # TODOS os anos (issues 382 e 383 do repo deles), medido em 6 variacoes da URL.
      # O coletor antigo continua no repositorio e volta a ser o caminho no dia em que
      # a Camara consertar: ele e incremental por deputado, enquanto este baixa 3,9 MB.
      - name: Rodar coletor de gastos (cota parlamentar, arquivo anual)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
        run: node coletores/coletor_gastos_arquivo.js $(date -u +%Y)

      - name: Sincronizar senadores (lista atual)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
        run: node coletores/coletor_senadores.js

      - name: Rodar coletor de gastos do Senado (CEAPS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANO: '2026'
        continue-on-error: true
        run: node coletores/coletor_gastos_senado.js

      - name: Piloto estadual — deputados de SP (ALESP)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANO_ALESP: '2026'
        continue-on-error: true
        run: node coletores/coletor_alesp.js

      # Rio Grande do Sul (ALERGS): NAO roda neste arquivo. O GitHub nao alcanca a ALERGS direto
      # (conexao TCP expira, medido em 15/10/2026, T4b/D-034), entao votos e gastos do RS rodam em
      # coletar_alergs.yml, que passa pela Edge Function alergs-ponte do Supabase (D-035, 17/10/2026).

      # Proposicoes dos federais e senadores. Ate 11/09/2026 isso so era atualizado quando
      # alguem rodava coletor_biografia.js a mao — e esse nunca esteve neste agendamento, entao
      # as proposicoes ficavam congeladas por meses. O coletor_proposicoes existe separado
      # justamente para caber aqui: faz uma coisa so, e proposicao muda toda semana enquanto
      # biografia quase nunca muda.
      # continue-on-error: se a API da Camara estiver fora do ar, os outros passos ja rodaram
      # e nao faz sentido marcar a execucao inteira como falha.
      - name: Proposições mais recentes (Câmara e Senado)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
        run: node coletores/coletor_proposicoes.js

      # Pedidos de CPI da Camara (I1, 13/10/2026). A pagina /cpis le a tabela pedidos_cpi_camara
      # porque o servidor da Vercel nao conecta no host da Camara ("fetch failed"); o GitHub conecta.
      # Uma vez por dia basta: pedido de CPI muda raramente. continue-on-error: se a Camara cair,
      # os outros passos ja rodaram e a tabela segue com os dados da ultima coleta boa.
      - name: Pedidos de CPI da Câmara
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
        run: node coletores/coletor_pedidos_cpi.js

      # Indicacoes do Executivo e o voto do Senado nelas (T10, 17/10/2026). Ate hoje so rodava a mao
      # (ultima coleta em 18/09/2026), entao a tela /indicacoes ficava congelada sem aviso. A fonte
      # e a API aberta do Senado, a mesma dos votos acima, entao o GitHub alcanca sem ponte.
      # SEMANAL (segunda-feira): indicacao do presidente muda pouco e cada rodada consulta a votacao
      # de cada mensagem. O cron e diario, entao o portao do dia da semana fica aqui no passo.
      # O botao manual (workflow_dispatch) roda sempre. continue-on-error pelo mesmo motivo dos dois
      # passos acima: se o Senado cair, o resto ja rodou e a data na tela simplesmente nao avanca.
      - name: Indicações do Executivo (segunda-feira ou manual)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            node coletores/coletor_indicacoes_executivo.js
          else
            echo "Hoje não é segunda-feira: indicações do Executivo ficam para a próxima semana."
          fi
