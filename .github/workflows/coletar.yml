name: Coletar dados (votos)

on:
  schedule:
    # 06:17 Brasília. O minuto quebrado é de proposito: o GitHub enfileira os agendamentos e
    # os horarios "redondos" (minuto 0) sao os mais disputados. Ainda assim o horario e um
    # PEDIDO, nao uma promessa — no historico deste repo o atraso tipico foi de 3 a 6 horas,
    # com um caso de 10h. Nao dependa da hora exata para nada.
    - cron: '17 9 * * *'
  workflow_dispatch:        # permite rodar manualmente pelo botão "Run workflow"

jobs:
  coletar-votos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        # --ignore-scripts evita compilação nativa do sharp (não usado nos coletores)
        run: npm install --ignore-scripts

      - name: Rodar coletor de votos (Câmara)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VOTACOES_LIMIT: '60'
        run: node coletores/coletor_votos.js

      - name: Rodar coletor de votos do Senado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANO: '2026'
        continue-on-error: true
        run: node coletores/coletor_votos_senado.js

      - name: Rodar coletor de gastos (cota parlamentar)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANO: '2026'
        continue-on-error: true
        run: node coletores/coletor_gastos.js

      - name: Sincronizar senadores (lista atual)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
        run: node coletores/coletor_senadores.js

      - name: Rodar coletor de gastos do Senado (CEAPS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANO: '2026'
        continue-on-error: true
        run: node coletores/coletor_gastos_senado.js

      - name: Piloto estadual — deputados de SP (ALESP)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANO_ALESP: '2026'
        continue-on-error: true
        run: node coletores/coletor_alesp.js

      # Rio Grande do Sul (ALERGS). O ano vai por $(date -u +%Y) em vez de fixo: assim a virada
      # de ano nao deixa o coletor preso em 2026, como aconteceu com os outros passos daqui.
      - name: Estadual RS — votos em plenário (ALERGS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
        run: node coletores/coletor_votos_alergs.js $(date -u +%Y)

      - name: Estadual RS — gastos de gabinete (ALERGS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
        run: node coletores/coletor_gastos_alergs.js $(date -u +%Y)

      # Proposicoes dos federais e senadores. Ate 11/09/2026 isso so era atualizado quando
      # alguem rodava coletor_biografia.js a mao — e esse nunca esteve neste agendamento, entao
      # as proposicoes ficavam congeladas por meses. O coletor_proposicoes existe separado
      # justamente para caber aqui: faz uma coisa so, e proposicao muda toda semana enquanto
      # biografia quase nunca muda.
      # continue-on-error: se a API da Camara estiver fora do ar, os outros passos ja rodaram
      # e nao faz sentido marcar a execucao inteira como falha.
      - name: Proposições mais recentes (Câmara e Senado)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
        run: node coletores/coletor_proposicoes.js
